[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextflow"
version = "0.1.0"
description = "System-wide, fully local context compression: select text anywhere, press a hotkey, get a shorter context-engineered version."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.3",
  "sentence-transformers>=3.0",
  "tiktoken>=0.7",
  "rapidfuzz>=3.0",
  "typer>=0.12",
  "psutil>=5.9",
  "huggingface_hub>=0.23",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.3"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
app = ["pynput>=1.7", "pyperclip>=1.8", "pystray>=0.19", "pillow>=10", "pywin32>=306; sys_platform == 'win32'", "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'"]
dev = ["pytest>=8"]

[project.scripts]
contextflow = "contextflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
